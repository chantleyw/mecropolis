<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mecropolis: field and crop tracker</title>
    <meta
      name="description"
      content="Field season stage calculated from live weather and growing degree days, with published regional yield statistics."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Applies a stored theme choice before first paint so the page does not flash the wrong palette. -->
    <script>
      try {
        var t = localStorage.getItem("mecropolis-theme")
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
