name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Public identifiers of the public-read dataset; no secrets are needed to build or test.
      VITE_SANITY_PROJECT_ID: mns0vhec
      VITE_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Types for the Sanity Functions typecheck and tests.
      - run: npm ci --prefix sanity-functions
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/audit.mjs
      - run: npm audit --prefix sanity-functions
